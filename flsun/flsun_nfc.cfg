# lanetag-nfc (formerly FLSUN_NFC): NFC/RFID filament tags on the FLSUN T1 /
# T1 Pro.
#
# Scan a spool's tag on the reader: it becomes Moonraker's active spool in
# Spoolman, the tag is linked to the spool, and the spool's material and
# color go to Moonraker's lane_data (OrcaSlicer, HelixScreen). There's one
# toolhead, so there's no slot prompt. See README.md.
#
# printer.cfg includes this file ([include flsun_nfc.cfg]); updates replace
# it. Put your own settings in a [flsun_nfc] section in flsun_nfc_user.cfg
# next to printer.cfg (create it). Both Klippers read it (FLSun's and
# upstream Klipper, which doesn't read the rest of printer.cfg), and its
# settings win.
#
# All options and their defaults:
#
#   reader: auto
#       auto, pn532, ccid (any PC/SC USB reader), acr1552u, acr122u, pn5180,
#       rc522.
#       auto tries USB CCID readers first, then USB serial adapters.
#       Network readers (LaneTag) need none of this: they send their reads
#       to Moonraker.
#   device:
#       Serial port of a PN532, or of the PN5180/RC522 bridge, such as
#       /dev/serial/by-path/platform-ffe00000.usb-usb-0:1.2:1.0-port0 (see
#       ls -l /dev/serial/by-path), or usb:<port> for a chip the kernel has
#       no driver for (see NFC_STATUS).
#       Empty probes CH340, CP210x, PL2303, FTDI, RP2040 and ESP32
#       adapters, except the mainboard's port (the mainboard is a CH340 too).
#   baud: 115200
#   ccid_reader:
#       Only use the CCID reader whose name or VID:PID contains this text.
#   poll_interval: 0.3
#       Seconds between looks for a tag.
#   retry_interval: 10
#       Seconds between attempts to find an unplugged or missing reader.
#   scan_while_printing: False
#   filament_sensor: filament_sensor
#       The [filament_switch_sensor] NFC_STATUS reports.
#   clear_active_spool: True
#       A tag that isn't a Spoolman spool clears the active spool, so the
#       filament used isn't booked on the spool that was loaded before.
#   spoolman: True
#       Look tags up in Spoolman when Moonraker has a [spoolman] section.
#   spoolman_auto_create: False
#       Add unknown tagged spools to Spoolman automatically (otherwise
#       NFC_CREATE_SPOOL adds the last one scanned).
#   spoolman_match_filament: True
#       A tag whose UID is not on any spool (such as the second tag of a
#       Snapmaker spool) matches the one spool with the tag's vendor,
#       material and color. Several matches are left to pick by hand.
#   bind_card_uid: True
#       Remember the tag's UID on the Spoolman spool it was assigned as, so
#       plain UID tags work next time.
#   scan_gcode:
#   scan_error_gcode:
#       G-code to run after a good scan, or a failed one (tag left the
#       reader too soon, no filament data), e.g. a macro that flashes the
#       light. The T1 has no speaker lanetag-nfc can use.
#   moonraker_url: http://127.0.0.1:7125
#   lane_data: True
#       After a scan, write the spool (name, vendor, Spoolman ID,
#       temperatures) to Moonraker's lane_data, lane 1.
#   disabled_formats:
#       Comma-separated decoders to skip, e.g. Text, Qidi.
#   mifare_keys:
#       Extra MIFARE Classic keys to try, comma-separated, 12 hex digits each.
#   bambu_key:
#   creality_key:
#   creality_encryption_key:
#   snapmaker_key:
#       Not needed: the published Bambu, Creality and Snapmaker keys are built
#       in. Setting one overrides it; a wrong key is reported at startup.
#
# Camera QR labels (NFC_QR_SCAN, or the SCAN_QR_LABEL macro below):
#
#   qr_snapshot_url: http://127.0.0.1/webcam/?action=snapshot
#   qr_scan_time: 20
#       Seconds to keep looking for a label.
#   qr_width: 1024
#       Large frames are scaled down towards this width for decoding.
#   qr_decoder: auto
#       turbojpeg, pillow, ffmpeg, or auto (the first that is available).
#   qr_ffmpeg:
#       Path to ffmpeg. Empty finds it on PATH.

[flsun_nfc]
# The FF_NFC core's speaker support is for Flashforge printers.
beep: False

[gcode_macro SCAN_QR_LABEL]
description: Read a spool's QR label (Spoolman, OpenSpool) with the printer camera
gcode:
    NFC_QR_SCAN

# Your own settings, if the file exists (a wildcard include may match
# nothing).
[include flsun_nfc_user*.cfg]
