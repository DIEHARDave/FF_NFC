# lanetag-nfc - Moonraker settings (FLSUN T1)
# flsun/install.sh copies this file to ~/printer_data/config/lanetag-nfc.conf
# once (with the clone's path filled in) and never overwrites it.

[update_manager lanetag-nfc]
type: git_repo
channel: stable
primary_branch: main
path: @REPO_DIR@
origin: https://github.com/DIEHARDave/lanetag-nfc.git
# Klipper loads the new code when it restarts.
managed_services: klipper
