# FF_NFC's Moonraker part on Kiln OS (Kiln includes it while the plugin is
# on): updates from Fluidd (Settings > Software Updates), release tags only.
# After an update, RESTART Klipper: Kiln then runs root/update.sh by itself
# when root/ changed.
# No managed_services: Kiln's Moonraker can't restart services
# (provider: none), so the update would end in an error.
[update_manager ff_nfc]
type: git_repo
channel: stable
path: /data/ad5x/plugins/ff_nfc
origin: https://github.com/DIEHARDave/lanetag-nfc.git
primary_branch: main
is_system_service: False
