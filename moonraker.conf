# FF_NFC's Moonraker part on Kiln OS (Kiln includes it while the plugin is
# on): updates from Fluidd (Settings > Software Updates), release tags only.
# After an update, RESTART Klipper; if NFC_STATUS then says the USB hook is
# outdated, run install.sh again as root.
[update_manager ff_nfc]
type: git_repo
channel: stable
path: /data/ad5x/plugins/ff_nfc
origin: https://github.com/DIEHARDave/FF_NFC.git
primary_branch: main
is_system_service: False
managed_services: klipper
