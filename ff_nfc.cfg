# FF_NFC: NFC/RFID filament tags for Flashforge printers on Zmod (AD5X,
# Creator 5 Pro) and Kiln OS (AD5X).
#
# Scan a spool's tag; a prompt asks for the IFS slot or toolhead (or insert
# the filament into an empty slot), and the slot gets the spool's material
# and color (and on Kiln OS its nozzle temperature), plus its Spoolman
# spool. See README.md.
#
# Zmod includes this file when the plugin is enabled, Kiln OS through
# plugin.cfg. Plugin updates replace it, so put your own settings in a
# [ff_nfc] section of their own: in mod_data/user.cfg on Zmod, in
# local.cfg on Kiln OS. Klipper merges both sections, and yours win.
#
# Options marked (Zmod) or (Kiln) only apply there; the other platform
# ignores them.
#
# All options and their defaults:
#
#   reader: auto
#       auto, pn532, ccid (any PC/SC USB reader), acr1552u, acr122u, pn5180,
#       rc522.
#       auto tries USB CCID readers first, then USB serial adapters.
#       Network readers (LaneTag) need none of this: they send their reads
#       to Moonraker.
#   device:
#       Serial port of a PN532, or of the PN5180/RC522 bridge: a tty such as
#       /dev/ttyUSB0, or usb:<port> (usb:1-1.2, see NFC_STATUS) for a chip
#       the kernel has no driver for (Kiln OS on the stock kernel). Empty
#       probes USB serial adapters (CH340, CP210x, PL2303, FTDI, RP2040,
#       ESP32) that no Klipper MCU uses.
#   baud: 115200
#   ccid_reader:
#       Only use the CCID reader whose name or VID:PID contains this text.
#   poll_interval: 0.3
#       Seconds between looks for a tag.
#   retry_interval: 10
#       Seconds between attempts to find an unplugged or missing reader.
#   prompt_timeout: 60
#       Close the slot prompt after this many seconds; 0 keeps it open.
#   assign_on_insert: True
#       While the prompt is open, inserting filament into an empty slot
#       assigns the scanned spool to that slot.
#   scan_while_printing: False
#   beep: True
#       Beep on the printer's speaker (AD5X, Creator 5 Pro) after a scan:
#       short and high when the tag was read, longer and low when it left
#       the reader too soon or has no filament data. Kiln OS on its own
#       kernel plays it with ad5x-sound; on the stock kernel it needs the
#       cmd_pwm Zmod left behind and install.sh (see README.md).
#       NFC_STATUS shows whether the speaker was found.
#   beep_frequency: 1500
#   beep_duration: 0.2
#   beep_error_frequency: 600
#   beep_error_duration: 0.6
#       Hz and seconds.
#   scan_gcode:
#   scan_error_gcode:
#       G-code to run instead of the beep, e.g. a macro that flashes a light.
#   spoolman: True
#       Look tags up in Spoolman when Moonraker has a [spoolman] section.
#   spoolman_auto_create: False
#       Add unknown tagged spools to Spoolman automatically. Without it the
#       prompt offers an "Add to Spoolman" button.
#   spoolman_match_filament: True
#       A tag whose UID is not on any spool (such as the second tag of a
#       Snapmaker spool) matches the one spool with the tag's vendor,
#       material and color. Several matches are left to pick by hand.
#   bind_card_uid: True
#       Remember the tag's UID on the Spoolman spool it was assigned as, so
#       plain UID tags work next time.
#   set_temperature: True
#       (Kiln) Set the slot's nozzle temperature from Spoolman or the tag.
#   skip_zmod_color_prompt: True
#       (Zmod) After a filament insert Zmod asks for the slot's color and
#       material.
#       Skip that popup when the slot was just set from a tag, or assign the
#       open tag prompt to the inserted slot instead.
#   skip_zmod_color_window: 300
#       (Zmod) Seconds after a tag assignment in which the slot's popup is
#       skipped.
#   moonraker_url: http://127.0.0.1:7125
#   lane_data: True
#       After an assignment, add the spool (name, vendor, Spoolman ID,
#       temperatures) to the slot's Moonraker lane_data entry, for
#       OrcaSlicer and HelixScreen. On Kiln OS the record is written so
#       HelixScreen shows the scanned spool even over a color picked on its
#       screen.
#   disabled_formats:
#       Comma-separated decoders to skip, e.g. Text, Qidi.
#   mifare_keys:
#       Extra MIFARE Classic keys to try, comma-separated, 12 hex digits each.
#   bambu_key:
#   creality_key:
#   creality_encryption_key:
#   snapmaker_key:
#       Not needed: the published Bambu, Creality and Snapmaker keys are built
#       in. Setting one overrides it; a wrong key is reported at startup.
#
# Camera QR labels (NFC_QR_SCAN, or the SCAN_QR_LABEL macro below):
#
#   qr_snapshot_url:
#       Camera snapshot (JPEG) URL. The default is the printer's first
#       camera: http://127.0.0.1:8080/?action=snapshot on Zmod (AD5X and
#       Creator 5), http://127.0.0.1:8090/?action=snapshot on Kiln OS.
#   qr_scan_time: 20
#       Seconds to keep looking for a label.
#   qr_width:
#       Large frames are scaled down towards this width for decoding. Small
#       codes are read again from a full-resolution crop. 1024 on Zmod; 640
#       on Kiln OS, which decodes its 1280x720 frames at half size, about
#       1 s per frame (1280 reads them whole, about 5 s).
#   qr_decoder: auto
#       How camera JPEGs are decoded: pillow (Kiln OS ships it), turbojpeg
#       (libturbojpeg in Zmod's chroot), ffmpeg, or auto (the first of
#       these that is available).
#   qr_chroot: /usr/data/.mod/.zmod
#       (Zmod) The chroot holding python3 and libturbojpeg.
#   qr_ffmpeg:
#       Path to ffmpeg. Empty finds it on PATH or under /usr/prog.

[ff_nfc]

[gcode_macro SCAN_QR_LABEL]
description: Read a spool's QR label (Spoolman, OpenSpool) with the printer camera
gcode:
    NFC_QR_SCAN
